[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-ps1"
version = "0.1.0"
description = "Validator-oriented railway possession scheduling for Nebula Hack PS1"
requires-python = ">=3.11"
dependencies = ["ortools==9.15.6755"]

[project.scripts]
nebula-ps1 = "nebula_ps1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
