[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-ps1"
version = "0.1.0"
description = "Validator-oriented railway possession scheduling for Nebula Hack PS1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "ortools==9.15.6755",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
nebula-ps1 = "nebula_ps1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nebula_ps1 = ["static/*"]
